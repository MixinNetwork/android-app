name: Android CI

on:
  push:
    branches:
    - master
    - bugfix/*
    - feature/*
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: 'temurin'
    - name: Make Gradle executable
      run: chmod +x ./gradlew

    - name: Set google-service.json data
      env:
        DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$DATA" ]; then
          printf '%s' "$DATA" > app/src/debug/google-services.json
        else
          cat > app/src/debug/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "123456789012", "project_id": "mixin-ci"},
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0000000000000000",
                "android_client_info": {"package_name": "one.mixin.messenger"}
              },
              "api_key": [{"current_key": "ci-placeholder"}]
            }],
            "configuration_version": "1"
          }
        JSON
        fi

    - name: Build
      run: ./gradlew :app:assembleGooglePlayDebug :app:assembleOtherChannelDebug --stacktrace

    - name: Run tests
      run: ./gradlew :app:testGooglePlayDebugUnitTest

    - name: Upload unit test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: unit-test-results-${{ github.run_attempt }}
        path: |
          app/build/reports/tests/testGooglePlayDebugUnitTest/
          app/build/test-results/testGooglePlayDebugUnitTest/
        retention-days: 7
