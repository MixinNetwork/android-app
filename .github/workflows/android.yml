name: Android CI

on:
  push:
    branches:
    - master
    - bugfix/*
    - feature/*
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: 'temurin'
    - name: Make Gradle executable
      run: chmod +x ./gradlew

    - name: Set google-service.json data
      env:
        DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$DATA" ]; then
          printf '%s' "$DATA" > app/src/debug/google-services.json
        else
          cat > app/src/debug/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "123456789012", "project_id": "mixin-ci"},
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0000000000000000",
                "android_client_info": {"package_name": "one.mixin.messenger"}
              },
              "api_key": [{"current_key": "ci-placeholder"}]
            }],
            "configuration_version": "1"
          }
        JSON
        fi

    - name: Build
      run: >-
        ./gradlew --no-daemon --max-workers=1
        -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"
        -Pkotlin.daemon.jvmargs=-Xmx6g
        :app:assembleGooglePlayDebug :app:assembleOtherChannelDebug --stacktrace

    - name: Run tests
      timeout-minutes: 15
      run: |
        cat > "$RUNNER_TEMP/test-diagnostics.gradle" <<'GRADLE'
        allprojects {
          tasks.withType(Test).configureEach {
            testLogging {
              events 'started', 'failed', 'skipped'
              exceptionFormat 'full'
            }
          }
        }
        GRADLE
        (
          while sleep 120; do
            date -u
            free -m
            ps -eo pid,ppid,rss,comm --sort=-rss | sed -n '1,12p'
            jps -l
            for test_pid in $(jps -l | awk '$2 ~ /GradleWorkerMain$/ {print $1}'); do
              timeout 15s jcmd "$test_pid" GC.heap_info || true
              timeout 15s jcmd "$test_pid" Thread.print || true
            done
          done
        ) &
        diagnostics_pid=$!
        trap 'pkill -P "$diagnostics_pid" 2>/dev/null || true; kill "$diagnostics_pid" 2>/dev/null || true; wait "$diagnostics_pid" 2>/dev/null || true' EXIT
        ./gradlew --no-daemon --max-workers=1 \
          -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" \
          -Pkotlin.daemon.jvmargs=-Xmx6g \
          :app:testGooglePlayDebugUnitTest --init-script "$RUNNER_TEMP/test-diagnostics.gradle"

    - name: Upload unit test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: unit-test-results-${{ github.run_attempt }}
        path: |
          app/build/reports/tests/testGooglePlayDebugUnitTest/
          app/build/test-results/testGooglePlayDebugUnitTest/
        retention-days: 7
